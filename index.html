<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="stylesheet.css">
  
  <title>Frontend Mentor | QR code component</title>

</head>
<body>
  <div class="container">
    <img src="./images/image-qr-code.png" alt="QR Code" class="qr-code">
    <h1 style="font-weight: 700;">Improve your front-end skills by building projects</h1>
    <p style="font-weight: 400; font-size: 15px;">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Minenhle C Tshuma</a>.
  </footer>
</body>
</html>
